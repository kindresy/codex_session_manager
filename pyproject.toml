[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-manager"
version = "0.1.0"
description = "A colorful terminal browser for Codex CLI sessions"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-session = "codex_session_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

